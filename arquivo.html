<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar do Pregão</title><meta name="description" content="Briefing diário do mercado financeiro por Diogo Prestes, Analista CNPI-T."><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"><style>
:root{--bg:#F6F7F9;--card:#FFFFFF;--fg:#1B2230;--mut:#5B6475;--line:#E2E5EB;--ink:#0A0F1C;--ink-fg:#F4F1EA;--gold:#F5B83D;--gold-d:#8A5A00;
--ent:#FFF8E6;--up:#0E8F7E;--dn:#D23F33;--link:#1F4FBF;--soft:#F1F3F7;--th:#0A0F1C;--th-fg:#F4F1EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0F1A;--card:#121828;--fg:#E6E9F0;--mut:#9AA3B5;--line:#232B3F;--ink:#05070D;--ink-fg:#F4F1EA;--gold:#F5B83D;--gold-d:#F5B83D;--ent:#2A2411;--up:#2BC4AE;--dn:#FF7A6E;--link:#8DB1FF;--soft:#171E31;--th:#1E2740;--th-fg:#F4F1EA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F1A;--card:#121828;--fg:#E6E9F0;--mut:#9AA3B5;--line:#232B3F;--ink:#05070D;--ink-fg:#F4F1EA;--gold:#F5B83D;--gold-d:#F5B83D;--ent:#2A2411;--up:#2BC4AE;--dn:#FF7A6E;--link:#8DB1FF;--soft:#171E31;--th:#1E2740;--th-fg:#F4F1EA;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:820px;margin:0 auto;padding-block:20px 48px}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline} a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:'Inter Display',Inter,'Segoe UI',Arial,sans-serif;font-weight:800;margin:0;text-wrap:balance}
.hdr{background:var(--ink);color:var(--ink-fg);border-radius:14px;padding:22px 22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:flex-end;gap:3px;height:28px}.logo i{display:block;width:4px;background:var(--gold);border-radius:1px}
.brand b{letter-spacing:.28em;font-size:.8rem;font-weight:800}
.hdr h1{font-size:clamp(1.5rem,5vw,2.1rem);margin-top:12px;line-height:1.15}.hdr h1 span{color:var(--gold)}
.hdr p{margin:8px 0 0;font-size:.85rem;color:#C9CED8}.hdr .by{color:var(--ink-fg);font-weight:600}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.how div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.85rem;background:var(--card);min-width:0}.how b{display:block;margin-bottom:2px}
.toc{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 20px}
.toc a{padding:5px 0;font-size:.92rem}
h2.sec{font-size:1.35rem;margin:36px 0 12px;padding-bottom:7px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:12px;scroll-margin-top:12px}
h2.sec a.top{font-size:.75rem;font-weight:600;white-space:nowrap}
h3{font-size:1.05rem;margin:18px 0 4px}p{margin:0 0 10px;max-width:70ch}
ol.res{margin:0;padding:0;list-style:none}ol.res li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ol.res .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:800;font-size:.8rem;text-align:center;line-height:26px}
ol.res .t{flex:1;min-width:0}.more{font-size:.85rem;font-weight:600;white-space:nowrap}
.pb{display:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:.85rem;min-width:560px}
caption{text-align:left;font-weight:800;font-size:1rem;padding:6px 0}
th{background:var(--th);color:var(--th-fg);text-align:left;padding:7px 9px;font-weight:600}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}.fl{color:var(--mut);font-weight:700}
.ent{background:var(--ent);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;margin:14px 0;font-size:.93rem}
.ent b.k{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--gold-d);margin-bottom:3px}
.warn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:.85rem;color:var(--mut);margin:10px 0}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.chip{background:var(--th);color:var(--th-fg);border-radius:14px;padding:4px 11px;font-size:.82rem;font-weight:600}.arr{color:var(--gold);font-weight:800}
.mech{padding:10px 0;border-bottom:1px solid var(--line)}
.cb{display:inline-block;width:13px;height:13px;border:2px solid var(--fg);border-radius:3px;margin-right:9px;vertical-align:-1px}
ul.chk{list-style:none;padding:0;margin:6px 0}ul.chk li{padding:4px 0}
.q{margin:14px 0;scroll-margin-top:12px}.q ol{margin:6px 0 6px 22px;padding:0;list-style:upper-alpha}
.ans{margin:10px 0;padding:10px 14px;background:var(--soft);border-radius:8px;scroll-margin-top:12px}
dl{margin:0}dt{font-weight:700;margin-top:10px}dd{margin:0 0 2px;color:var(--mut)}
.src{padding-left:20px}.src li{margin:4px 0;font-size:.88rem;overflow-wrap:anywhere}
.meth{border:1.5px solid var(--fg);border-radius:10px;padding:14px 16px;margin-top:28px;font-size:.88rem;background:var(--card)}
.meth b.k{font-size:1rem;display:block;margin-bottom:4px}
footer.site{margin-top:24px;font-size:.8rem;color:var(--mut)}

.q ol li{cursor:pointer;padding:8px 12px;margin:6px 0 6px -4px;border:1px solid var(--line);border-radius:8px;background:var(--card);list-style-position:inside}
.q ol li:hover{border-color:var(--gold)}.q ol li:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.q.done ol li{cursor:default}.q.done ol li:hover{border-color:var(--line)}
.q ol li.ok{border-color:var(--up);background:color-mix(in srgb,var(--up) 14%,var(--card))}
.q ol li.no{border-color:var(--dn);background:color-mix(in srgb,var(--dn) 14%,var(--card))}
.fb{margin:8px 0 0;padding:10px 14px;border-radius:8px;background:var(--soft);font-size:.92rem}
.fb b.ok{color:var(--up)}.fb b.no{color:var(--dn)}
.fb button{font:inherit;font-size:.82rem;margin-left:8px;background:none;border:0;color:var(--link);cursor:pointer;padding:0}
.q .quizhint{font-size:.78rem;color:var(--mut)}
nav.top{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;padding:4px 0 14px}</style></head><body><main><nav class="top"><a href="index.html">Última edição</a><a href="arquivo.html">Arquivo de edições</a></nav><h2 class="sec"><span>Arquivo de edições</span></h2><ul class="src"><li><a href="edicoes/2026-11-11.html">11/11/2026</a></li></ul></main></body></html>
